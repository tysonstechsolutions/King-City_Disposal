<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="dumpsterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#15803d"/>
      <stop offset="100%" style="stop-color:#166534"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1e293b"/>
  
  <!-- Ground shadow -->
  <ellipse cx="200" cy="265" rx="150" ry="20" fill="#0f172a"/>
  
  <!-- Dumpster body - front -->
  <path d="M60 120 L80 240 L320 240 L340 120 Z" fill="url(#dumpsterGrad)"/>
  
  <!-- Dumpster body - side (3D effect) -->
  <path d="M340 120 L340 240 L360 220 L360 100 Z" fill="url(#sideGrad)"/>
  
  <!-- Top rim -->
  <path d="M55 120 L60 110 L340 110 L345 120 L360 100 L350 90 L50 90 L40 100 Z" fill="#166534"/>
  
  <!-- Horizontal ridges -->
  <rect x="70" y="145" width="260" height="8" fill="#166534" opacity="0.5"/>
  <rect x="75" y="175" width="250" height="8" fill="#166534" opacity="0.5"/>
  <rect x="78" y="205" width="244" height="8" fill="#166534" opacity="0.5"/>
  
  <!-- Door outline -->
  <rect x="130" y="140" width="140" height="95" fill="none" stroke="#166534" stroke-width="4"/>
  <rect x="195" y="175" width="10" height="30" rx="2" fill="#166534"/>
  
  <!-- Size label -->
  <rect x="150" y="45" width="100" height="35" rx="17" fill="#22c55e"/>
  <text x="200" y="70" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">14 YARD</text>
  
  <!-- Dimensions -->
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">14' L × 7' W × 4' H</text>
</svg>
