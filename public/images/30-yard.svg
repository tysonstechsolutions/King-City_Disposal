<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="dumpsterGrad30" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
    <linearGradient id="sideGrad30" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#15803d"/>
      <stop offset="100%" style="stop-color:#166534"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1e293b"/>
  
  <!-- Ground shadow -->
  <ellipse cx="200" cy="268" rx="165" ry="24" fill="#0f172a"/>
  
  <!-- Dumpster body - front (wider & taller) -->
  <path d="M30 95 L60 245 L340 245 L370 95 Z" fill="url(#dumpsterGrad30)"/>
  
  <!-- Dumpster body - side (3D effect) -->
  <path d="M370 95 L370 245 L395 215 L395 65 Z" fill="url(#sideGrad30)"/>
  
  <!-- Top rim -->
  <path d="M25 95 L30 83 L370 83 L375 95 L395 65 L385 53 L20 53 L5 65 Z" fill="#166534"/>
  
  <!-- Horizontal ridges -->
  <rect x="50" y="120" width="310" height="10" fill="#166534" opacity="0.5"/>
  <rect x="54" y="158" width="302" height="10" fill="#166534" opacity="0.5"/>
  <rect x="56" y="196" width="298" height="10" fill="#166534" opacity="0.5"/>
  
  <!-- Door outline -->
  <rect x="110" y="115" width="180" height="125" fill="none" stroke="#166534" stroke-width="5"/>
  <rect x="195" y="160" width="12" height="40" rx="3" fill="#166534"/>
  
  <!-- "BIG JOBS" badge -->
  <rect x="140" y="20" width="120" height="25" rx="12" fill="#ef4444"/>
  <text x="200" y="38" font-family="Arial Black, sans-serif" font-size="12" font-weight="900" fill="white" text-anchor="middle">🔥 BIG JOBS</text>
  
  <!-- Size label -->
  <rect x="150" y="47" width="100" height="35" rx="17" fill="#22c55e"/>
  <text x="200" y="72" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">30 YARD</text>
  
  <!-- Dimensions -->
  <text x="200" y="288" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">22' L × 8' W × 6' H</text>
</svg>
