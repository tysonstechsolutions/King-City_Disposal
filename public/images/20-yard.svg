<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="dumpsterGrad20" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
    <linearGradient id="sideGrad20" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#15803d"/>
      <stop offset="100%" style="stop-color:#166534"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1e293b"/>
  
  <!-- Ground shadow -->
  <ellipse cx="200" cy="265" rx="160" ry="22" fill="#0f172a"/>
  
  <!-- Dumpster body - front (wider) -->
  <path d="M40 115 L65 240 L335 240 L360 115 Z" fill="url(#dumpsterGrad20)"/>
  
  <!-- Dumpster body - side (3D effect) -->
  <path d="M360 115 L360 240 L385 215 L385 90 Z" fill="url(#sideGrad20)"/>
  
  <!-- Top rim -->
  <path d="M35 115 L40 105 L360 105 L365 115 L385 90 L375 80 L30 80 L15 90 Z" fill="#166534"/>
  
  <!-- Horizontal ridges -->
  <rect x="55" y="140" width="295" height="8" fill="#166534" opacity="0.5"/>
  <rect x="60" y="172" width="285" height="8" fill="#166534" opacity="0.5"/>
  <rect x="63" y="204" width="279" height="8" fill="#166534" opacity="0.5"/>
  
  <!-- Door outline -->
  <rect x="120" y="135" width="160" height="100" fill="none" stroke="#166534" stroke-width="4"/>
  <rect x="195" y="170" width="10" height="35" rx="2" fill="#166534"/>
  
  <!-- "MOST POPULAR" banner -->
  <rect x="115" y="35" width="170" height="25" rx="12" fill="#fbbf24"/>
  <text x="200" y="53" font-family="Arial Black, sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">⭐ MOST POPULAR</text>
  
  <!-- Size label -->
  <rect x="150" y="62" width="100" height="35" rx="17" fill="#22c55e"/>
  <text x="200" y="87" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">20 YARD</text>
  
  <!-- Dimensions -->
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">22' L × 8' W × 4' H</text>
</svg>
